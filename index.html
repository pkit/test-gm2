<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaser Timer App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1429 100%);
            font-family: 'Arial Black', Arial, sans-serif;
        }
        #game-container {
            box-shadow: 0 20px 60px rgba(255, 51, 102, 0.3), 0 0 100px rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(255, 51, 102, 0.4);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="node_modules/phaser/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
